<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0,user-scalable=no">
<title>TYPHOON 3D</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 overflow:hidden;
 background:#111;
 font-family:Arial,sans-serif;
}
canvas{display:block}
#hud{
 position:absolute;
 top:12px;
 left:12px;
 color:white;
 background:#111b;
 padding:12px;
 border-radius:12px;
 z-index:5;
}
#controls{
 position:absolute;
 bottom:20px;
 width:100%;
 display:flex;
 justify-content:space-between;
 padding:15px;
 z-index:5;
 pointer-events:none;
}
.group{display:flex;gap:10px;pointer-events:auto}
button{
 border:2px solid white;
 background:#111c;
 color:white;
 border-radius:15px;
 padding:16px;
 font-size:17px;
 font-weight:bold;
}
#message{
 position:absolute;
 top:100px;
 left:50%;
 transform:translateX(-50%);
 color:white;
 background:#111c;
 padding:10px;
 border-radius:10px;
}
#mission{
 position:absolute;
 top:110px;
 right:10px;
 color:white;
 background:#111c;
 padding:10px;
 border-radius:10px;
}
</style>
</head>

<body>

<div id="hud">
 <b>🌆 TYPHOON 3D</b><br>
 💰 Cash: $<span id="cash">0</span><br>
 🚗 Vehicle: <span id="vehicle">On Foot</span>
</div>

<div id="message">Welcome to TYPHOON CITY</div>

<div id="mission">
 🎯 FIRST MISSION<br>
 Explore the city!
</div>

<div id="controls">
 <div class="group">
  <button id="left">◀</button>
  <button id="forward">▲</button>
  <button id="back">▼</button>
  <button id="right">▶</button>
 </div>
 <div class="group">
  <button id="action">ENTER CAR</button>
 </div>
</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb,80,300);

const camera = new THREE.PerspectiveCamera(
 70,window.innerWidth/window.innerHeight,0.1,500
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

// LIGHTING

scene.add(new THREE.HemisphereLight(0xffffff,0x555566,2));

const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(50,100,50);
sun.castShadow=true;
scene.add(sun);

// GROUND

const ground = new THREE.Mesh(
 new THREE.PlaneGeometry(400,400),
 new THREE.MeshStandardMaterial({color:0x388449})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-0.1;
ground.receiveShadow=true;
scene.add(ground);

// ROADS

function road(x,z,w,d){
 const r=new THREE.Mesh(
  new THREE.BoxGeometry(w,0.1,d),
  new THREE.MeshStandardMaterial({color:0x292929})
 );
 r.position.set(x,0,z);
 scene.add(r);
}

road(0,0,400,16);
road(0,0,16,400);

for(let i=-180;i<=180;i+=12){
 const line=new THREE.Mesh(
  new THREE.BoxGeometry(0.4,0.03,5),
  new THREE.MeshBasicMaterial({color:0xffffff})
 );
 line.position.set(i,0.07,0);
 scene.add(line);
}

// BUILDINGS

const buildings=[];

function building(x,z){
 const h=THREE.MathUtils.randFloat(10,35);
 const w=THREE.MathUtils.randFloat(8,15);

 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,w),
  new THREE.MeshStandardMaterial({
   color:new THREE.Color().setHSL(
    Math.random()*0.12+0.05,
    0.35,
    Math.random()*0.3+0.35
   )
  })
 );

 mesh.position.set(x,h/2,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 scene.add(mesh);
 buildings.push(mesh);

 // Windows

 for(let y=3;y<h-2;y+=4){
  for(let side of [-1,1]){
   const win=new THREE.Mesh(
    new THREE.BoxGeometry(0.9,1.2,0.12),
    new THREE.MeshBasicMaterial({color:0x9cdbff})
   );
   win.position.set(x+side*w/2,y,z);
   scene.add(win);
  }
 }
}

for(let x=-170;x<=170;x+=25){
 for(let z=-170;z<=170;z+=25){
  if(Math.abs(x)<17||Math.abs(z)<17)continue;
  building(x,z);
 }
}

// PLAYER

const player=new THREE.Group();

const body=new THREE.Mesh(
 new THREE.BoxGeometry(1,1.7,0.6),
 new THREE.MeshStandardMaterial({color:0x1769aa})
);
body.position.y=1.3;
body.castShadow=true;
player.add(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(0.4,16,16),
 new THREE.MeshStandardMaterial({color:0xc58b65})
);
head.position.y=2.4;
player.add(head);

scene.add(player);

// CAR

const car=new THREE.Group();

const carBody=new THREE.Mesh(
 new THREE.BoxGeometry(3,1,5),
 new THREE.MeshStandardMaterial({color:0xe32636,metalness:0.4})
);
carBody.position.y=1;
car.add(carBody);

const cabin=new THREE.Mesh(
 new THREE.BoxGeometry(2.3,0.9,2.5),
 new THREE.MeshStandardMaterial({color:0x222e40})
);
cabin.position.set(0,1.8,-0.2);
car.add(cabin);

const wheels=[];

for(let x of [-1.5,1.5]){
 for(let z of [-1.5,1.5]){
  const wheel=new THREE.Mesh(
   new THREE.CylinderGeometry(0.55,0.55,0.35,16),
   new THREE.MeshStandardMaterial({color:0x111111})
  );
  wheel.rotation.z=Math.PI/2;
  wheel.position.set(x,0.55,z);
  car.add(wheel);
  wheels.push(wheel);
 }
}

car.position.set(5,0,5);
scene.add(car);

// GAME STATE

let cash=0;
let driving=false;
let speed=0;
let angle=0;

const keys={};
const clock=new THREE.Clock();

function message(t){
 document.getElementById('message').innerText=t;
}

function updateHUD(){
 document.getElementById('cash').innerText=cash;
 document.getElementById('vehicle').innerText=
 driving?'Driving':'On Foot';
}

// MOBILE CONTROLS

function hold(id,key){
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{
  e.preventDefault();
  keys[key]=true;
 });
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>{
  b.addEventListener(ev,()=>keys[key]=false);
 });
}

hold('forward','forward');
hold('back','back');
hold('left','left');
hold('right','right');

window.addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
});
window.addEventListener('keyup',e=>{
 keys[e.key.toLowerCase()]=false;
});

// ENTER / EXIT CAR

document.getElementById('action').onclick=()=>{
 const distance=player.position.distanceTo(car.position);

 if(!driving&&distance<7){
  driving=true;
  player.visible=false;
  message('You entered your car!');
 }else if(driving){
  driving=false;
  player.visible=true;
  player.position.copy(car.position);
  player.position.x+=3;
  message('You left the car!');
 }else{
  message('Walk closer to the red car!');
 }
 updateHUD();
};

// CAMERA

camera.position.set(0,8,12);

// GAME LOOP

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),0.05);

 if(driving){

  if(keys.forward||keys['w'])speed+=20*dt;
  if(keys.back||keys['s'])speed-=20*dt;

  speed*=0.97;
  speed=THREE.MathUtils.clamp(speed,-12,30);

  if(Math.abs(speed)>0.3){
   if(keys.left||keys['a'])angle+=2*dt;
   if(keys.right||keys['d'])angle-=2*dt;
  }

  car.rotation.y=angle;

  car.position.x+=Math.sin(angle)*speed*dt;
  car.position.z+=Math.cos(angle)*speed*dt;

  wheels.forEach(w=>w.rotation.x+=speed*dt);

 }else{

  let movement=0;

  if(keys.forward||keys['w'])movement=1;
  if(keys.back||keys['s'])movement=-1;

  if(keys.left||keys['a'])player.rotation.y+=2*dt;
  if(keys.right||keys['d'])player.rotation.y-=2*dt;

  player.position.x+=Math.sin(player.rotation.y)*movement*8*dt;
  player.position.z+=Math.cos(player.rotation.y)*movement*8*dt;
 }

 // FOLLOW CAMERA

 const target=driving?car:player;

 const behind=new THREE.Vector3(
  Math.sin(target.rotation.y)*10,
  7,
  Math.cos(target.rotation.y)*10
 );

 camera.position.lerp(
  target.position.clone().add(behind),
  0.08
 );

 camera.lookAt(target.position.x,target.position.y+1,target.position.z);

 // EXPLORATION REWARD

 if(!driving&&player.position.length()>80){
  cash+=1;
  player.position.set(0,0,0);
  message('Exploration mission complete! +$1');
  updateHUD();
 }

 renderer.render(scene,camera);
}

animate();

// RESIZE

window.addEventListener('resize',()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>
</body>
</html>
